[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "framediet"
version = "0.1.0"
description = "Media-aware context utilities for code-driven video workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AI soidet" }]
keywords = ["video", "hyperframes", "remotion", "ffmpeg", "whisper", "toon", "claude-code"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/AIsoidet/FrameDiet"
Repository = "https://github.com/AIsoidet/FrameDiet"
Issues = "https://github.com/AIsoidet/FrameDiet/issues"

[project.optional-dependencies]
benchmark = ["tiktoken>=0.7"]

[project.scripts]
framediet = "framediet.cli:main"
fdiet = "framediet.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/framediet"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/LICENSE",
  "/skills",
  "/pyproject.toml",
]
